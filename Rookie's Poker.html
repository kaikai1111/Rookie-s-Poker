  --font:"Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --gut:max(16px, env(safe-area-inset-left,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:300;font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#fff}
.wrap{max-width:480px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.4;font-weight:500}
button{font-family:inherit;color:inherit;cursor:pointer;font-weight:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bleed{margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)))}

/* header bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px))}
.mark{display:flex;align-items:center;gap:10px}
.mark b{font-weight:500;font-size:1rem;letter-spacing:.04em;color:var(--ink2)}
.logo{display:block;background:var(--logo) center/contain no-repeat;flex:none}
.logo.sm{width:36px;height:36px}
.logo.lg{width:132px;height:132px;margin-bottom:10px;filter:drop-shadow(0 10px 18px rgba(31,80,170,.25))}
.change{background:none;border:1px solid var(--gold);color:var(--gold-d);padding:9px 12px;font-size:.8rem;font-weight:500;letter-spacing:.04em}

/* photo bands */
.band{position:relative;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  padding:28px max(20px,env(safe-area-inset-left,0px)) 24px;background-size:cover;background-position:center}
.band::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.62))}
.band > *{position:relative}
.band h1{font-weight:300;font-size:2.1rem;letter-spacing:.04em}
.band h2{font-weight:300;font-size:1.7rem;letter-spacing:.04em}
.band p{margin:0;font-size:.84rem;font-weight:300;color:rgba(255,255,255,.88);max-width:30ch}
.band .en{font-size:.68rem;letter-spacing:.3em;color:rgba(255,255,255,.8)}
.band.tall{min-height:200px}
.band.plain{background:none;color:var(--ink2);padding:32px 0 4px;text-align:center;align-items:center}
.band.plain::before{display:none}
.band.plain .en{color:var(--gold)}
.band.plain h1{color:var(--ink2)}
.band.plain p{color:var(--muted);max-width:none}
.band.short{min-height:150px}
.im-hero{background-image:var(--img-hero)} .im-cash{background-image:var(--img-cash)} .im-tour{background-image:var(--img-tour)}
.strip{background:rgba(0,0,0,.45);margin:14px calc(-1 * max(20px,env(safe-area-inset-left,0px))) -24px;padding:10px max(20px,env(safe-area-inset-left,0px));
  display:flex;justify-content:space-between;align-items:baseline;font-size:.72rem;letter-spacing:.18em}
.strip b{font-size:1.15rem;font-weight:300;letter-spacing:.08em}

/* section heading */
.sec{text-align:center;display:flex;flex-direction:column;gap:2px;padding-top:30px}
.sec .en{font-size:1.2rem;font-weight:200;letter-spacing:.06em;color:var(--gold)}
.sec .ja{font-size:.8rem;color:var(--muted)}

/* menu */
#menu{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
#menu .step{flex:1;display:flex;flex-direction:column;gap:16px;padding-bottom:16px}
.choices{flex:1;display:flex;flex-direction:column;gap:10px}
.tile{flex:1;min-height:128px;border:0;border-radius:0;padding:22px 52px 22px 22px;text-align:left;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;
  background-size:cover;background-position:center;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.7),rgba(0,0,0,.25));transition:background .2s}
.tile:active::before{background:rgba(0,0,0,.75)}
.tile > *{position:relative}
.tile::after{content:"";position:absolute;right:22px;top:50%;width:12px;height:12px;border-top:1px solid #fff;border-right:1px solid #fff;transform:translateY(-50%) rotate(45deg)}
.tile .en{font-size:.66rem;letter-spacing:.3em;color:rgba(255,255,255,.75)}
.tile b{font-size:1.5rem;font-weight:300;letter-spacing:.04em;line-height:1.35}
.tile .stack-num{font-size:2.1rem;font-weight:200;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tile .d{font-size:.8rem;color:rgba(255,255,255,.85);max-width:28ch;line-height:1.6}
.tile[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--gold)}
.back{align-self:flex-start;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;font-size:.85rem;color:var(--muted)}
.credit{font-size:.62rem;color:var(--faint);text-align:center;letter-spacing:.1em}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  padding:0 max(0px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-right,0px))}
.tabs button{border:0;background:none;padding:18px 4px 16px;font-size:.95rem;font-weight:400;color:var(--muted);position:relative}
.tabs button[aria-selected="true"]{color:var(--ink2);font-weight:500}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--gold)}
#main{padding-bottom:76px}
.panel{display:flex;flex-direction:column;gap:18px}

/* content */
.box{background:#fff;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px}
.box h3{font-size:.98rem;font-weight:500;color:var(--ink2)}
.hint{font-size:.78rem;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr;gap:6px}
.lg{display:flex;align-items:center;gap:10px;font-size:.84rem}
.sw{flex:none;width:14px;height:14px}
.L4{background:var(--l4);color:var(--l4-ink)} .L3{background:var(--l3);color:var(--l3-ink)}
.L2{background:var(--l2);color:var(--l2-ink)} .L1{background:var(--l1);color:var(--l1-ink)}
.L0{background:var(--l0);color:var(--l0-ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);margin:4px -18px -18px}
.stats span{display:flex;flex-direction:column-reverse;align-items:center;padding:14px 6px;font-size:.72rem;font-weight:200;color:var(--muted);text-align:center;line-height:1.4}
.stats span + span{border-left:1px solid var(--line)}
.stats b{color:var(--ink2);font-size:1.6rem;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.felt{background:#fff;border:1px solid var(--line);padding:6px}
.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:1px;width:100%}
.cell{aspect-ratio:1;border:0;border-radius:0;padding:0;font-weight:500;font-size:clamp(7.5px,2.3vw,12px);letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.cell.sel{outline:2px solid var(--ink2);outline-offset:-1px;position:relative;z-index:1}
.detail-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.detail-head b{font-weight:500}
.hand-tag{font-size:1.3rem;font-weight:500;padding:4px 12px;font-variant-numeric:tabular-nums}
.vlist{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.vlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.85rem}
.act{font-size:.76rem;font-weight:500;padding:4px 10px;white-space:nowrap;letter-spacing:.04em}
.A-allin{background:var(--l4);color:var(--l4-ink)} .A-raise{background:var(--l2);color:var(--l2-ink)}
.A-call{background:var(--l1);color:var(--l1-ink)} .A-fold,.A-check{background:var(--l0);color:var(--muted)}
.notes{margin:0;padding-left:1.1em;font-size:.86rem;display:flex;flex-direction:column;gap:8px;max-width:65ch}
.notes li::marker{color:var(--gold)}

/* playing cards */
.pc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--card-line);border-radius:3px;width:2.2em;height:3em;font-weight:700;line-height:1;gap:2px;font-size:15px;flex:none}
.pc i{font-style:normal;font-size:.9em}
.su-s{color:var(--su-s)} .su-h{color:var(--su-h)} .su-d{color:var(--su-d)} .su-c{color:var(--su-c)}
.pc.dim{opacity:.35}
.pc.lg{font-size:28px;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.pc.empty{background:var(--bg2);border:1px dashed var(--card-line);color:var(--faint)}

/* hand ranking */
.ranks{display:flex;flex-direction:column;margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.rank{border-bottom:1px solid var(--line);padding:16px 2px;display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:6px 12px}
.rank .no{font-size:1.6rem;font-weight:200;color:var(--gold);font-variant-numeric:tabular-nums;grid-row:span 3;line-height:1.1}
.rank h3{font-size:1rem;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rank h3 small{font-size:.68rem;color:var(--faint);font-weight:300;letter-spacing:.12em;text-transform:uppercase}
.rank p{margin:0;font-size:.82rem;color:var(--muted)}
.cards{display:flex;gap:4px;flex-wrap:wrap}
.prob{font-variant-numeric:tabular-nums;font-size:.74rem;color:var(--gold-d);white-space:nowrap}

/* judge */
.deck-wrap{background:var(--bg2);border:1px solid var(--line);padding:8px}
.deck{display:flex;flex-direction:column;gap:4px;overflow-x:auto}
.deck-row{display:grid;grid-template-columns:repeat(13,minmax(24px,1fr));gap:3px}
.dk{border:1px solid var(--card-line);background:var(--card);border-radius:2px;padding:5px 0;font-weight:700;font-size:.8rem;line-height:1.15;display:flex;flex-direction:column;align-items:center;transition:transform .12s}
.dk[aria-pressed="true"]{outline:2px solid var(--gold);outline-offset:1px;transform:translateY(-3px);box-shadow:0 6px 12px rgba(0,0,0,.15)}
.picked{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ghost{background:none;border:1px solid var(--line);padding:8px 12px;font-size:.78rem;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;padding:9px 12px;font-size:.82rem}
.seg button[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:400}
.sub-label{font-size:.68rem;font-weight:400;color:var(--gold);letter-spacing:.24em}
.verdict{padding:22px 20px;display:flex;flex-direction:column;gap:6px}
.verdict .big-v{font-size:1.45rem;font-weight:500;line-height:1.4}
.verdict p{margin:0;font-size:.86rem}
.verdict .act{background:rgba(0,0,0,.18)!important;color:inherit}
.VF{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      <span class="en">NO-LIMIT HOLD'EM GUIDE</span>

        <button class="tile im-tour" data-game="tour" aria-pressed="false"><span class="en">TOURNAMENT</span><b>トーナメント</b><span class="d">最後の1人まで勝ち残る。ブラインドが上がり、アンティあり</span></button>

<script>
const R = 'AKQJT98765432'.split('');
const RN = {A:'エース',K:'キング',Q:'クイーン',J:'ジャック',T:'テン','9':'ナイン','8':'エイト','7':'セブン','6':'シックス','5':'ファイブ','4':'フォー','3':'スリー','2':'ツー'};
const DISP = r => r === 'T' ? '10' : r;
const SUITS = [{k:'s',sym:'♠',red:false},{k:'h',sym:'♥',red:true},{k:'d',sym:'♦',red:true},{k:'c',sym:'♣',red:false}];
const SUIT = Object.fromEntries(SUITS.map(s => [s.k, s]));

/* 行=上のランク(A→2)、列=左のランク。右上=スーテッド、左下=オフスート、対角=ペア
   4:赤 3:オレンジ 2:緑 1:青 0:フォールド */
const CHARTS = {
  c100:{game:'cash', num:'100BB', label:'ディープ', kind:'deep', desc:'一般的なバイイン額。添付の表そのまま',
    rows:['4443322222332','4443322111111','3343322111111','2223322111110','2222332110000','1111233211000','1110013321000','1000001332100','1000000123200','1000000012310','1000000001210','1000000000020','1000000000002'],
    notes:['青は「誰かがレイズしたとき」か「BBにいるとき」にコールで参加する手。自分から最初にコールだけで入る（リンプ）のは非推奨です。',
      '54s・65sのようなスーテッドコネクターは単体では弱いですが、ストレートやフラッシュが完成するとAAのような強い手からスタックを丸ごと奪えます。100BBあるからこそ参加する価値がある手です。',
      'ただしUTGなど前の席では、こうした投機的な手はフォールド寄りにしましょう。',
      '上の色ほど強い手です。赤はレイズもコールもでき、オレンジは3ベットされてもコールできます。']},
  c50:{game:'cash', num:'50BB', label:'ミドル', kind:'deep', desc:'半分のバイイン、または負けて減ったとき',
    rows:['4443322222322','4433221111100','3243221000000','2214321000000','2111321000000','1000032100000','1000002210000','0000000221000','0000000022100','1000000002200','0000000000200','0000000000010','0000000000001'],
    notes:['スタックが浅いと、役が完成したときに取れる額も減ります。そのため小さいペアやスーテッドコネクター、弱いオフスートの価値が下がります。',
      'その代わりJJ・AQs・AKoのような手は、3ベットされたらそのままオールインまで持っていけます。',
      '33・22はほぼ「誰かのレイズにコール」専用です。セットが当たったときだけ続けましょう。']},
  cshort:{game:'cash', num:'〜25BB', label:'ショート', kind:'short', desc:'残りチップが少ないとき。プッシュかフォールド',
    rows:['4444333223222','4433322111111','4343221100000','3224221000000','3211421000000','2100141100000','2100003100000','2000000310000','1000000031000','2000000002100','1000000000200','1000000000020','1000000000002'],
    notes:['25BB以下では「小さくレイズ」より「オールイン（プッシュ）かフォールド」が基本です。相手に降りてもらうだけでブラインドが取れます。',
      '小さいポケットやスーテッドコネクターは、浅いスタックでは役が完成しても取れる額が少ないので、前の席ではフォールドします。',
      '後ろの席（BTN・SB）ほど、残っている相手が少ないので広くプッシュできます。',
      '相手のオールインにコールできるのは赤だけ。自分から先に打つのと、相手の打ちに乗るのとでは必要な強さが違います。']},
  t:{game:'tour', num:'30BB〜', label:'通常', kind:'deep', desc:'序盤〜中盤。スタックに余裕があるとき',
    rows:['4443322222322','4433222111111','3343221110000','3224321100000','2211422100000','2111132100000','2100013210000','2000000321000','1000000022100','2000000002210','1000000000210','1000000000020','1000000000002'],
    notes:['トーナメントにはアンティ（全員が払う参加料）があるので、ポットが大きく、キャッシュより少し広く参加して取りに行きます。',
      '一度チップがなくなると終わりなので、ギリギリの勝負は避けめにしましょう。',
      '入賞直前（バブル）や賞金が大きく上がる場面では、表より一段階きつめにするのが安全です。']},
  tshort:{game:'tour', num:'〜15BB', label:'ショート', kind:'short', desc:'ブラインドが上がって残りが少ないとき',
    rows:['4444433333333','4443332222111','4343322111100','4324322100000','3222422100000','3211142100000','3110014210000','3100001321000','2100000032100','3100000003200','2100000000310','2100000000030','2100000000003'],
    notes:['15BB以下はプッシュ（オールイン）かフォールドだけで戦います。待っているとブラインドとアンティでどんどん削られます。',
      'Aを含むスーテッドはどれも強いプッシュ候補です。',
      '10BBを切ったら、表の青いハンドも前の席からプッシュしてOK。ブラインドに食われる前に動きましょう。',
      '相手のオールインには赤だけコール。BBにいるときはすでに払っている分、オレンジでもコールできます。']}
};

const LEGEND = {
  deep:{4:'オールインまでOK（4ベット）',3:'3ベットされてもコール',2:'レイズで参加（オープン）',1:'誰かのレイズにコールで参加',0:'フォールド'},
  short:{4:'プッシュ＆相手のオールインにもコール',3:'どの席からでもプッシュ',2:'CO・BTN・SBからプッシュ',1:'BTN・SBからプッシュ',0:'フォールド'}
};

const DEEP_SITS = [
  {k:'open', t:'まだ誰もレイズしていない'},
  {k:'vsRaise', t:'前の人がレイズしてきた'},
  {k:'vs3bet', t:'自分のレイズに3ベットされた'},
  {k:'vs4bet', t:'4ベット・オールインされた'}
];
const POS = [{k:'ep',t:'前（UTG・HJ）'},{k:'co',t:'CO'},{k:'btn',t:'BTN'},{k:'sb',t:'SB'},{k:'bb',t:'BB'}];
const SHORT_SITS = [{k:'first',t:'自分より前は全員フォールド'},{k:'vsPush',t:'誰かがオールインした'}];
const ACT_LABEL = {allin:'オールイン',raise:'レイズ',call:'コール',fold:'フォールド',check:'チェック'};

function deepVerdict(L, sit){
  if(sit==='open'){
    if(L>=2) return {act:'raise', title:'レイズでいきましょう', note:'目安は2.5BB（大きいブラインドの2.5倍）。'};
    if(L===1) return {act:'fold', title:'フォールドしましょう', note:'このハンドは「誰かのレイズにコールする」用。自分から最初に入るのは非推奨です。BBなら無料でチェックしてOK。'};
    return {act:'fold', title:'フォールドしましょう', note:'参加しないのが基本のハンドです。'};
  }
  if(sit==='vsRaise'){
    if(L===4) return {act:'raise', title:'リレイズ（3ベット）でいきましょう', note:'目安は相手のレイズ額の約3倍。'};
    if(L>=2) return {act:'call', title:'コールでいきましょう', note:'強めの手なので、後ろの席なら3ベットを混ぜても構いません。'};
    if(L===1) return {act:'call', title:'コールでいきましょう', note:'BBや後ろの席（BTN）からのコール向き。前の席ならフォールドでもOK。'};
    return {act:'fold', title:'フォールドしましょう', note:'レイズに付き合うには弱いハンドです。'};
  }
  if(sit==='vs3bet'){
    if(L===4) return {act:'allin', title:'4ベット・オールインでいきましょう', note:'最強クラス。相手のスタックを全部狙いましょう。'};
    if(L===3) return {act:'call', title:'コールでいきましょう', note:'フロップを見てから判断。'};
    return {act:'fold', title:'フォールドしましょう', note:'3ベットは強い手のサイン。降りるのが正解です。'};
  }
  if(L===4) return {act:'call', title:'コールで勝負しましょう', note:'オールイン勝負に乗れる強さです。'};
  return {act:'fold', title:'フォールドしましょう', note:'4ベット以上に付き合えるのは赤だけです。'};
}

function shortVerdict(L, pos, sit){
  if(sit==='first'){
    if(pos==='bb') return L>=2
      ? {act:'check', title:'チェックでOK', note:'全員フォールドならあなたの勝ち。SBがコールだけしてきたら、このハンドならオールインで勝負できます。'}
      : {act:'check', title:'チェックでOK', note:'全員フォールドならあなたの勝ち。SBがコールしてきても無理せずチェックで進めます。'};
    const late = ['co','btn','sb'].includes(pos), latest = ['btn','sb'].includes(pos);
    if(L>=3 || (L===2 && late) || (L===1 && latest))
      return {act:'allin', title:'オールイン（プッシュ）でいきましょう', note:'スタックが少ないときは、小さくレイズするより全部賭けたほうが相手を降ろせて得です。'};
    return {act:'fold', title:'フォールドしましょう', note: L>=1 ? 'もっと後ろの席ならプッシュできるハンドです。' : 'このスタックでは参加しないハンドです。'};
  }
  if(L===4) return {act:'call', title:'コールで勝負しましょう', note:'相手のオールインに乗れる強さです。'};
  if(L===3 && pos==='bb') return {act:'call', title:'コールで勝負しましょう', note:'BBはすでにチップを払っているので、少し広くコールできます。'};
  if(L===3) return {act:'fold', title:'フォールドしましょう', note:'自分から先にオールインするのはOK。でも相手のオールインには降ります。'};
  return {act:'fold', title:'フォールドしましょう', note:'オールインに付き合うには弱いハンドです。'};
}

/* helpers */
function cellHand(r,c){ return r===c ? R[r]+R[c] : (c>r ? R[r]+R[c]+'s' : R[c]+R[r]+'o'); }
function handPos(h){ const a=R.indexOf(h[0]), b=R.indexOf(h[1]); if(a===b) return [a,a]; return h[2]==='s' ? [a,b] : [b,a]; }
function handName(h){
  if(h[0]===h[1]) return 'ポケット'+RN[h[0]]+'（'+DISP(h[0])+'のペア）';
  return RN[h[0]]+'・'+RN[h[1]]+(h[2]==='s' ? ' スーテッド（同じマーク）' : ' オフスート（違うマーク）');
}
function combos(h){ return h.length===2 ? 6 : (h[2]==='s' ? 4 : 12); }
const lvl = (key,r,c) => +CHARTS[key].rows[r][c];
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function cardHTML(rank, suit, extra=''){
  const s = SUIT[suit];
  return `<span class="pc su-${suit} ${extra}">${DISP(rank)}<i>${s.sym}</i></span>`;
}

/* state */
const state = {game:null, chart:null, mode:'range', sel:'AKs', cards:['As','Ks'], sit:'open', pos:'btn', ssit:'first'};
try{ const s = JSON.parse(localStorage.getItem('pokerHayamichou')||'null'); if(s && CHARTS[s.chart]) Object.assign(state, s); }catch(e){}
function save(){ try{ localStorage.setItem('pokerHayamichou', JSON.stringify(state)); }catch(e){} }

const $ = s => document.querySelector(s);
const menu = $('#menu'), main = $('#main'), view = $('#view');

/* menu */
const IMG = {c100:'hero', c50:'tour', cshort:'cash', t:'hero', tshort:'cash'};
function renderStackChoices(){
  const box = $('#stackChoices');
  $('#step2Label').textContent = (state.game==='cash'?'キャッシュゲーム':'トーナメント') + '：自分のスタックを選ぶ';
  box.innerHTML = Object.entries(CHARTS).filter(([,c]) => c.game===state.game).map(([k,c]) =>
    `<button class="tile im-${IMG[k]}" data-chart="${k}" aria-pressed="${state.chart===k}"><span class="en">${c.label==="ショート"?"SHORT STACK":c.label==="通常"?"STANDARD":c.label==="ミドル"?"MIDDLE STACK":"DEEP STACK"}</span><span class="stack-num">${c.num}</span><b>${c.label}</b><span class="d">${c.desc}</span></button>`).join('');
  box.querySelectorAll('[data-chart]').forEach(b => b.onclick = () => { state.chart = b.dataset.chart; save(); showMain(); });
}
function showStep(n){
  $('#step1').hidden = n!==1; $('#step2').hidden = n!==2; $('#menuBand').hidden = n===2;
  if(n===2) renderStackChoices();
  window.scrollTo(0,0);
}
document.querySelectorAll('[data-game]').forEach(b => b.onclick = () => { state.game = b.dataset.game; save(); showStep(2); });
$('#backBtn').onclick = () => showStep(1);
function showMenu(){
  menu.hidden = false; main.hidden = true;
  document.querySelectorAll('[data-game]').forEach(x => x.setAttribute('aria-pressed', x.dataset.game===state.game));
  showStep(1);
}
function showMain(){
  menu.hidden = true; main.hidden = false;
  const c = CHARTS[state.chart];
  render(); window.scrollTo(0,0);
}
$('#changeBtn').onclick = showMenu;
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { state.mode = b.dataset.mode; save(); render(); });

const BANDS = {range:['HAND RANGE','ハンドレンジ','hero'], hands:['HAND RANKINGS','役表','tour'], judge:['HAND CHECK','ハンド審査','cash']};
function render(){
  const c = CHARTS[state.chart], [en, ja, im] = BANDS[state.mode];
  const pb = $('#pageBand'); pb.className = 'band short bleed im-' + im;
  pb.innerHTML = `<span class="en">${en}</span><h2>${ja}</h2><div class="strip"><span>${c.game==='cash'?'CASH GAME':'TOURNAMENT'}</span><b>${c.num}</b></div>`;
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-selected', b.dataset.mode===state.mode));
  if(state.mode==='range') renderRange();
  else if(state.mode==='hands') renderHands();
  else renderJudge();
}

/* ===== レンジ表 ===== */
function verdictList(key, L){
  const c = CHARTS[key];
  if(c.kind==='deep') return DEEP_SITS.map(s => { const v = deepVerdict(L,s.k); return {t:s.t, v}; });
  const out = [];
  const pushPos = POS.filter(p => p.k!=='bb' && shortVerdict(L,p.k,'first').act==='allin').map(p => p.t);
  out.push({t:'先にプッシュできる席', v:{act: pushPos.length?'allin':'fold', text: pushPos.length ? (pushPos.length===4?'どこからでも':pushPos.join('・')) : 'なし'}});
  out.push({t:'相手のオールインに（BB以外）', v:shortVerdict(L,'btn','vsPush')});
  out.push({t:'相手のオールインに（BBのとき）', v:shortVerdict(L,'bb','vsPush')});
  return out;
}
function renderRange(){
  const key = state.chart, c = CHARTS[key], leg = LEGEND[c.kind];
  let total=0, part=0, strong=0;
  for(let r=0;r<13;r++) for(let k=0;k<13;k++){ const h=cellHand(r,k), n=combos(h), L=lvl(key,r,k); total+=n; if(c.kind==='deep'){ if(L>=2) part+=n; } else { if(L>=1) part+=n; } if(L===4) strong+=n; }
  const pct = x => (x/total*100).toFixed(1)+'%';
  let cells='';
  for(let r=0;r<13;r++) for(let k=0;k<13;k++){
    const h = cellHand(r,k);
    cells += `<button class="cell L${lvl(key,r,k)} ${h===state.sel?'sel':''}" data-h="${h}" aria-label="${h}">${DISP(h[0])==='10'?'T':h[0]}${h[1]}${h[2]||''}</button>`;
  }
  view.innerHTML = `
    <div class="box">
      <h3>${c.game==='cash'?'キャッシュ':'トーナメント'} ${c.num} のハンドレンジ</h3>
      <div class="legend">${[4,3,2,1,0].map(l => `<div class="lg"><span class="sw L${l}"></span><span>${leg[l]}</span></div>`).join('')}</div>
      <div class="stats">
        <span>${c.kind==='deep'?'レイズで参加':'最大プッシュ範囲（BTN・SB）'}　<b>${pct(part)}</b></span>
        <span>赤（最強）　<b>${pct(strong)}</b></span>
      </div>
    </div>
    <div class="felt"><div class="grid" id="grid">${cells}</div></div>
    <div class="hint">右上＝同じマーク（s）、左下＝違うマーク（o）、斜め＝ペア。マスをタップすると動き方が出ます。</div>
    <div class="box" id="detail"></div>
    <div class="box"><h3>このスタックのポイント</h3><ul class="notes">${c.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`;
  view.querySelectorAll('.cell').forEach(b => b.onclick = () => {
    state.sel = b.dataset.h; save();
    view.querySelectorAll('.cell.sel').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
    renderDetail();
  });
  renderDetail();
}
function renderDetail(){
  const key = state.chart, [r,k] = handPos(state.sel), L = lvl(key,r,k), leg = LEGEND[CHARTS[key].kind];
  $('#detail').innerHTML = `
    <div class="detail-head"><span class="hand-tag L${L}">${state.sel}</span><div><b>${handName(state.sel)}</b><div class="hint">${leg[L]}</div></div></div>
    <ul class="vlist">${verdictList(key,L).map(x => `<li><span>${x.t}</span><span class="act A-${x.v.act}">${x.v.text || ACT_LABEL[x.v.act]}</span></li>`).join('')}</ul>`;
}

/* ===== 役表 ===== */
const HANDS = [
  {n:'ロイヤルフラッシュ', e:'Royal Flush', d:'同じマークの A・K・Q・J・10。最強の役。', c:['As','Ks','Qs','Js','Ts'], u:5, p:'0.003%'},
  {n:'ストレートフラッシュ', e:'Straight Flush', d:'同じマークで5枚の数字が連続。', c:['9h','8h','7h','6h','5h'], u:5, p:'0.03%'},
  {n:'フォーカード', e:'Four of a Kind', d:'同じ数字が4枚。', c:['Qs','Qh','Qd','Qc','7s'], u:4, p:'0.17%'},
  {n:'フルハウス', e:'Full House', d:'同じ数字3枚＋同じ数字2枚（スリーカード＋ワンペア）。', c:['Ks','Kh','Kd','4c','4s'], u:5, p:'2.6%'},
  {n:'フラッシュ', e:'Flush', d:'同じマークが5枚。数字はバラバラでOK。', c:['Ad','Jd','8d','6d','2d'], u:5, p:'3.0%'},
  {n:'ストレート', e:'Straight', d:'数字が5枚連続。マークはバラバラでOK。A-2-3-4-5も有効（A は 1 としても使える）。', c:['Tc','9d','8s','7h','6c'], u:5, p:'4.6%'},
  {n:'スリーカード', e:'Three of a Kind', d:'同じ数字が3枚。', c:['7s','7h','7d','Kc','2s'], u:3, p:'4.8%'},
  {n:'ツーペア', e:'Two Pair', d:'ペアが2組。', c:['Js','Jh','5d','5c','As'], u:4, p:'23.5%'},
  {n:'ワンペア', e:'One Pair', d:'同じ数字が2枚。', c:['Ah','Ac','Kd','9s','4h'], u:2, p:'43.8%'},
  {n:'ハイカード', e:'High Card', d:'役なし。一番強いカードで勝負。', c:['As','Jd','8c','5h','3s'], u:1, p:'17.4%'}
];
function renderHands(){
  view.innerHTML = `
    <div class="box">
      <h3>役の強さ（上ほど強い）</h3>
      <div class="hint">自分の2枚＋場の5枚、合計7枚から一番強い5枚で役を作ります。右の％は7枚で完成する確率。薄いカードは役に関係ない「キッカー」。</div>
    </div>
    <ol class="ranks">${HANDS.map((h,i) => `
      <li class="rank">
        <span class="no">${i+1}</span>
        <h3>${h.n}<small>${h.e}</small><span class="prob" style="margin-left:auto">${h.p}</span></h3>
        <div class="cards">${h.c.map((x,j) => cardHTML(x[0], x[1], j>=h.u?'dim':'')).join('')}</div>
        <p>${h.d}</p>
      </li>`).join('')}</ol>
    <div class="box">
      <h3>同じ役どうしのときは？</h3>
      <ul class="notes">
        <li>役を作っている数字が大きいほうが勝ち。例：Kのペア ＞ 9のペア。</li>
        <li>役の数字も同じなら、残りのカード（キッカー）の大きいほうが勝ち。例：A-A-K ＞ A-A-Q。</li>
        <li>マークに強さはありません。全く同じならポットを山分け（チョップ）。</li>
        <li>強さは A ＞ K ＞ Q ＞ J ＞ 10 ＞ 9 … ＞ 2。</li>
      </ul>
    </div>`;
}

/* ===== ハンド審査 ===== */
function judgeHand(){
  if(state.cards.length<2) return null;
  const [a,b] = state.cards, ia = R.indexOf(a[0]), ib = R.indexOf(b[0]);
  if(ia===ib) return R[ia]+R[ib];
  const hi = Math.min(ia,ib), lo = Math.max(ia,ib);
  return R[hi]+R[lo]+(a[1]===b[1]?'s':'o');
}
function renderJudge(){
  const c = CHARTS[state.chart];
  const deck = SUITS.map(s => `<div class="deck-row">${R.map(r => {
    const id = r+s.k, on = state.cards.includes(id);
    return `<button class="dk su-${s.k}" data-c="${id}" aria-pressed="${on}" aria-label="${DISP(r)}${s.sym}">${DISP(r)}<span>${s.sym}</span></button>`;
  }).join('')}</div>`).join('');
  const sitSeg = c.kind==='deep'
    ? `<div class="sub-label">状況</div><div class="seg" id="sitSeg">${DEEP_SITS.map(s=>`<button data-v="${s.k}" aria-pressed="${state.sit===s.k}">${s.t}</button>`).join('')}</div>`
    : `<div class="sub-label">自分の席</div><div class="seg" id="posSeg">${POS.map(p=>`<button data-v="${p.k}" aria-pressed="${state.pos===p.k}">${p.t}</button>`).join('')}</div>
       <div class="hint">BTN＝ディーラーの席。後ろの席（BTNに近い）ほど有利です。</div>
       <div class="sub-label">状況</div><div class="seg" id="ssitSeg">${SHORT_SITS.map(s=>`<button data-v="${s.k}" aria-pressed="${state.ssit===s.k}">${s.t}</button>`).join('')}</div>`;
  view.innerHTML = `
    <div class="box">
      <h3>手札を2枚選ぶ</h3>
      <div class="picked" id="picked"></div>
      <div class="deck-wrap"><div class="deck">${deck}</div></div>
    </div>
    <div class="box">${sitSeg}</div>
    <div id="result" class="panel"></div>`;
  view.querySelectorAll('.dk').forEach(b => b.onclick = () => {
    const id = b.dataset.c, i = state.cards.indexOf(id);
    if(i>=0) state.cards.splice(i,1); else { state.cards.push(id); if(state.cards.length>2) state.cards.shift(); }
    save(); renderJudge();
  });
  const bindSeg = (id, prop) => { const el = $(id); if(el) el.querySelectorAll('button').forEach(b => b.onclick = () => { state[prop] = b.dataset.v; save(); renderJudge(); }); };
  bindSeg('#sitSeg','sit'); bindSeg('#posSeg','pos'); bindSeg('#ssitSeg','ssit');

  const slots = [0,1].map(i => state.cards[i] ? cardHTML(state.cards[i][0], state.cards[i][1], 'lg') : `<span class="pc lg empty">?</span>`).join('');
  $('#picked').innerHTML = slots + `<button class="ghost" id="dealBtn">ランダムに配る</button>` + (state.cards.length ? `<button class="ghost" id="clearBtn">クリア</button>` : '');
  $('#dealBtn').onclick = () => {
    const all = []; SUITS.forEach(s => R.forEach(r => all.push(r+s.k)));
    const x = all.splice(Math.floor(Math.random()*52),1)[0], y = all[Math.floor(Math.random()*51)];
    state.cards = [x,y]; save(); renderJudge();
  };
  const cb = $('#clearBtn'); if(cb) cb.onclick = () => { state.cards = []; save(); renderJudge(); };

  const h = judgeHand(), res = $('#result');
  if(!h){ res.innerHTML = `<div class="box"><div class="hint">カードをあと${2-state.cards.length}枚選ぶと、どう動けばいいか表示します。</div></div>`; return; }
  const [r,k] = handPos(h), L = lvl(state.chart,r,k);
  const v = c.kind==='deep' ? deepVerdict(L, state.sit) : shortVerdict(L, state.pos, state.ssit);
  const tone = {allin:'L4', raise:'L2', call:'L1', fold:'VF', check:'VF'}[v.act];
  state.sel = h; save();
  res.innerHTML = `
    <div class="verdict ${tone}">
      <span class="act" style="align-self:flex-start;background:rgba(0,0,0,.14)">${ACT_LABEL[v.act]}</span>
      <div class="big-v">${v.title}</div>
      <p>${v.note}</p>
    </div>
    <div class="box">
      <div class="detail-head"><span class="hand-tag L${L}">${h}</span><div><b>${handName(h)}</b><div class="hint">${c.game==='cash'?'キャッシュ':'トーナメント'} ${c.num}：${LEGEND[c.kind][L]}</div></div></div>
      <ul class="vlist">${verdictList(state.chart,L).map(x => `<li><span>${x.t}</span><span class="act A-${x.v.act}">${x.v.text || ACT_LABEL[x.v.act]}</span></li>`).join('')}</ul>
    </div>`;
}

/* boot */
showMenu();
</script>
